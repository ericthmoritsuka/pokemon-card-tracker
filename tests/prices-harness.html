<!doctype html>
<!--
	A test page for the price components (js/price-view.js), driven by
	tests/prices-browser.test.mjs through tests/pages-server.mjs at
	/pokemon-card-tracker/tests/prices-harness.html?scene=<name>.

	It loads the real style.css and css/prices.css, seeds copies into the
	real collection (IndexedDB) with js/collection.js, and renders the
	components with the TCGdex records saved in tests/prices-fixtures. It
	never loads app.js, so nothing reaches Supabase or TCGdex. The exchange
	rate requests (US dollar and euro) go to api.frankfurter.dev, which the
	test answers itself.

	Scenes: english, portuguese, finishes, liga, legacy, korean, offline,
	norate, stats, markets, mismatch.
-->
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Price harness</title>
	<link rel="stylesheet" href="/pokemon-card-tracker/style.css">
	<link rel="stylesheet" href="/pokemon-card-tracker/css/prices.css">
	<style>
		main { padding: 16px; }
		.harness-tile { align-items: center; display: flex; gap: 8px; margin: 12px 0; }
	</style>
</head>
<body>
	<div id="errors"></div>
	<div class="toasts" id="toasts"></div>
	<main id="app"></main>
	<script type="module">
		import {addCard, listCards} from '/pokemon-card-tracker/js/collection.js';
		import {ligaUrl} from '/pokemon-card-tracker/js/liga.js';
		import {priceSection, statsBar, tilePrice} from '/pokemon-card-tracker/js/price-view.js';
		import {exchangeRates, extractPrices} from '/pokemon-card-tracker/js/prices.js';

		// The app's toast, for Undo: a line with its action button.
		const toasts = document.getElementById('toasts');
		const toast = (message, {action = null, actionLabel = null} = {}) => {
			const item = document.createElement('div');

			item.className = 'toast';
			item.textContent = message;

			if (action) {
				const button = document.createElement('button');

				button.textContent = actionLabel;
				button.type = 'button';
				button.onclick = () => {
					item.remove();
					action();
				};
				item.append(button);
			}

			toasts.append(item);
		};

		// An invented card listed only as Normal whose only TCGplayer price is
		// "holofoil", as some records carry, and one with no price at all.
		const holoOnly = {
			id: 'zz-holo-7', localId: '7', name: 'Testmon',
			set: {cardCount: {official: 99}, id: 'zz-holo', name: 'Test Set'},
			variants_detailed: [{type: 'normal', variantId: 'zz-normal', pricing: {
				cardmarket: {avg30: 3.3, avg7: 3.35, idProduct: 1, trend: 3.4, unit: 'EUR', updated: '2026-10-08T10:00:00.000Z'},
				tcgplayer: {holofoil: {marketPrice: 4.12, productId: 2}, unit: 'USD', updated: '2026-10-08T10:00:00.000Z'},
			}}],
		};
		const unpriced = {id: 'zz-none-1', localId: '1', name: 'Nopricemon', set: {cardCount: {official: 10}, id: 'zz-none', name: 'Test Set'}, variants_detailed: [{type: 'normal', variantId: 'zz-none-normal'}]};

		const fixture = async (name) => (await fetch(`/pokemon-card-tracker/tests/prices-fixtures/${name}.json`)).json();
		const scene = new URLSearchParams(location.search).get('scene') || 'english';
		const app = document.getElementById('app');

		// The app asks for the day's rate once at startup; tiles and the
		// statistics bar then read the saved one.
		await exchangeRates();

		const [exeggcute, exeggcutePt, charizard, bulbasaurPt] = await Promise.all([
			fixture('en-sv08.5-001'),
			fixture('pt-sv08.5-001'),
			fixture('en-base1-4'),
			fixture('pt-me01-001'),
		]);

		const variant = (card, label) => extractPrices(card).find((finish) => finish.label === label).variantId;
		const copy = (card, fields) => addCard({card_id: card.id, catalog: 'international', language: 'en', language_source: 'scan', ...fields});
		const englishLiga = (card) => ligaUrl({localId: card.localId, name: card.name, official: card.set.cardCount.official, setId: card.set.id, setName: card.set.name});

		// A tile stand-in and the statistics bar, redrawn after a save.
		function extras(card, label) {
			const tile = document.createElement('div');
			const stats = document.createElement('div');

			tile.className = 'harness-tile';
			tile.id = 'harness-tile';
			stats.id = 'harness-stats';

			const redraw = async () => {
				const entries = await listCards();

				tile.replaceChildren('Tile: ', tilePrice(entries, card) || 'no price');
				stats.replaceChildren(statsBar({cardsById: new Map([[`international|${card.id}`, card]]), entries, label}));
			};

			return {redraw, tile, stats};
		}

		if (scene === 'english') {
			await copy(charizard, {variant_id: variant(charizard, 'Holo, Unlimited')});
			app.append(priceSection({card: charizard, entries: await listCards(), language: 'en'}));
		}
		else if (scene === 'portuguese') {
			// A Portuguese copy on the Portuguese record. Ver na Liga is built from
			// the English record, as the card view does.
			await copy(exeggcutePt, {language: 'pt', variant_id: variant(exeggcutePt, 'Reverse holo')});
			app.append(priceSection({card: exeggcutePt, entries: await listCards(), language: 'pt', ligaHref: englishLiga(exeggcute), recordLanguage: 'pt'}));
		}
		else if (scene === 'finishes') {
			await copy(exeggcute, {variant_id: variant(exeggcute, 'Normal')});
			await copy(exeggcute, {variant_id: variant(exeggcute, 'Reverse holo, Master Ball pattern')});
			app.append(priceSection({card: exeggcute, entries: await listCards(), language: 'en'}));
		}
		else if (scene === 'liga') {
			// Two copies holding the same Liga price from before 2026-10-09,
			// and a third without one.
			const reverse = variant(exeggcute, 'Reverse holo');
			const view = extras(exeggcute, 'this card');
			const manual = {avg: 15, currency: 'BRL', date: '2026-10-01', finish: 'Reverse holo', language: 'pt', low_nm: 12, source: 'Liga Pokémon'};

			await copy(exeggcute, {price_manual: manual, variant_id: reverse});
			await copy(exeggcute, {price_manual: manual, variant_id: reverse});
			await copy(exeggcute, {variant_id: variant(exeggcute, 'Normal')});
			app.append(
				priceSection({card: exeggcute, entries: await listCards(), language: 'en', onSaved: view.redraw, toast, variantId: reverse}),
				view.tile,
				view.stats
			);
			await view.redraw();
		}
		else if (scene === 'mismatch') {
			// monprice "Holo" copies: on a card listed as Normal and reverses
			// (unmatched), on a card listed only as Normal priced only as holo,
			// and on a card with no price at all.
			await copy(exeggcute, {finish_raw: 'HOLOFOIL'});
			await copy(holoOnly, {finish_raw: 'HOLOFOIL'});
			await copy(unpriced, {finish_raw: 'HOLOFOIL'});

			const entries = await listCards();
			const of = (card) => entries.filter((entry) => entry.card_id === card.id);
			const tile = document.createElement('div');

			tile.className = 'harness-tile';
			tile.id = 'harness-tile';
			tile.append('Tiles: ', tilePrice(of(exeggcute), exeggcute) || 'no price', ' | ', tilePrice(of(holoOnly), holoOnly) || 'no price', ' | ', tilePrice(of(unpriced), unpriced) || 'no price');

			const stats = document.createElement('div');

			stats.id = 'harness-stats';
			stats.append(statsBar({cardsById: new Map([[`international|${exeggcute.id}`, exeggcute], [`international|${holoOnly.id}`, holoOnly], [`international|${unpriced.id}`, unpriced]]), entries, label: 'these cards'}));
			app.append(
				priceSection({card: exeggcute, entries: of(exeggcute), language: 'en'}),
				priceSection({card: holoOnly, entries: of(holoOnly), language: 'en', ligaHref: null}),
				priceSection({card: unpriced, entries: of(unpriced), language: 'en', ligaHref: null}),
				tile,
				stats
			);
		}
		else if (scene === 'korean') {
			// A Korean copy on a Japanese record, as the scanner saves it, with
			// the Japanese print's link handed in: Korean prints get none (Q-30).
			await copy(exeggcute, {catalog: 'ja', fallback: true, language: 'ko'});
			app.append(priceSection({card: exeggcute, entries: await listCards(), language: 'ko', ligaHref: englishLiga(exeggcute), recordLanguage: 'ja'}));
		}
		else if (scene === 'legacy') {
			// A Liga price saved before it said its finish and language.
			await copy(exeggcute, {price_manual: {avg: 52.3, currency: 'BRL', date: '2026-09-19', low_nm: 45.9, source: 'Liga Pokémon'}, variant_id: variant(exeggcute, 'Normal')});
			app.append(priceSection({card: exeggcute, entries: await listCards(), language: 'en'}));
		}
		else if (scene === 'offline' || scene === 'norate') {
			await copy(exeggcute, {variant_id: variant(exeggcute, 'Reverse holo, Poké Ball pattern')});

			const view = extras(exeggcute, 'this card');

			app.append(priceSection({card: exeggcute, entries: await listCards(), language: 'en'}), view.tile, view.stats);
			await view.redraw();
		}
		else if (scene === 'stats') {
			// One Liga price, two US estimates, and two unknowns.
			const cards = new Map([[`international|${exeggcute.id}`, exeggcute], [`international|${charizard.id}`, charizard]]);

			await copy(exeggcute, {price_manual: {avg: 52.3, currency: 'BRL', date: '2026-09-19', low_nm: 45.9, source: 'Liga Pokémon'}, variant_id: variant(exeggcute, 'Normal')});
			await copy(exeggcute, {variant_id: variant(exeggcute, 'Reverse holo, Master Ball pattern')});
			await copy(charizard, {variant_id: variant(charizard, 'Holo, Unlimited')});
			await copy(charizard, {variant_id: variant(charizard, 'Holo, Shadowless')});
			await addCard({card_id: 'zz-404', catalog: 'international', language: 'pt'});
			app.append(statsBar({cardsById: cards, entries: await listCards(), label: 'this binder'}));
		}

		else if (scene === 'markets') {
			// Other markets: an English card with both markets, then a
			// Portuguese copy whose league-stamped reverse has only Cardmarket.
			await copy(charizard, {variant_id: variant(charizard, 'Holo, Unlimited')});
			await copy(bulbasaurPt, {language: 'pt', variant_id: variant(bulbasaurPt, 'Reverse holo, League foil, 30th pokeday stamp')});

			const entries = await listCards();
			const of = (card) => entries.filter((entry) => entry.card_id === card.id);

			app.append(
				priceSection({card: charizard, entries: of(charizard), language: 'en'}),
				priceSection({card: bulbasaurPt, entries: of(bulbasaurPt), language: 'pt', ligaHref: null, recordLanguage: 'pt'})
			);
		}

		window.harnessReady = true;
	</script>
</body>
</html>
