<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Card Tracker</title>
	<script>
		// GitHub Pages serves this file for any path it has no file for, such as
		// /pokemon-card-tracker/camera. Send the visitor to the app with the
		// intended path in ?p=, and app.js puts that path back with
		// history.replaceState. No hash is used, because iOS drops the camera
		// permission when the hash changes.
		(function () {
			var base = '/pokemon-card-tracker/';
			var path = window.location.pathname;

			if (path.indexOf(base) !== 0) {
				return;
			}

			var rest = path.slice(base.length);
			var search = window.location.search;
			var target = base + '?p=' + encodeURIComponent(rest);

			if (search.length > 1) {
				target += '&' + search.slice(1);
			}

			window.location.replace(target);
		})();
	</script>
	<style>
		body {
			background: #ffffff;
			color: #1b1b1f;
			font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
			margin: 0;
			padding: 24px 16px;
		}

		a {
			color: #dc0a2d;
		}
	</style>
</head>
<body>
	<p>Opening Card Tracker. If nothing happens, <a href="/pokemon-card-tracker/">open the app</a>.</p>
</body>
</html>
