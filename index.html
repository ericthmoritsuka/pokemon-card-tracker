<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<title>Card Tracker</title>
	<meta name="description" content="Keep your Pokémon cards on your phone, import them from monprice, and browse the catalog by set and language.">
	<meta name="theme-color" content="#1d2e60">
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-title" content="Card Tracker">
	<meta name="apple-mobile-web-app-status-bar-style" content="default">
	<link rel="manifest" href="/pokemon-card-tracker/manifest.webmanifest">
	<link rel="icon" type="image/png" sizes="192x192" href="/pokemon-card-tracker/icons/icon-192.png">
	<link rel="apple-touch-icon" sizes="180x180" href="/pokemon-card-tracker/icons/apple-touch-icon.png">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<!-- Poppins loads without blocking the first paint; offline, the system font is used. -->
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&amp;display=swap" media="print" onload="this.media='all'">
	<link rel="preconnect" href="https://api.tcgdex.net" crossorigin>
	<link rel="preconnect" href="https://assets.tcgdex.net">
	<link rel="preconnect" href="https://ehdkbxrjxsypegbtrxbw.supabase.co" crossorigin>
	<link rel="stylesheet" href="/pokemon-card-tracker/style.css">
	<script type="module" src="/pokemon-card-tracker/app.js"></script>
</head>
<body>
	<header class="top">
		<div class="brand">
			<h1>Card Tracker</h1>
			<button class="sync-status" id="sync-status" type="button" aria-live="polite" hidden></button>
		</div>
		<a class="account" id="account" href="/pokemon-card-tracker/signin" data-link="signin">Sign in</a>
		<details class="menu" id="menu">
			<summary>Menu</summary>
			<nav class="menu-items" aria-label="More">
				<a href="/pokemon-card-tracker/import" data-link="import">Import from monprice</a>
				<a href="/pokemon-card-tracker/cards" data-link="cards">My Cards and CSV export</a>
				<a href="/pokemon-card-tracker/check" data-link="check">Phone check</a>
			</nav>
		</details>
	</header>

	<main>
		<div id="banner" class="banner" hidden></div>
		<div id="errors" aria-live="assertive"></div>
		<div id="view">
			<noscript>
				<p class="error">Card Tracker needs JavaScript. Turn it on and reload the page.</p>
			</noscript>
		</div>
	</main>

	<nav class="tabs" aria-label="Main">
		<a href="/pokemon-card-tracker/cards" data-link="cards" data-tab="cards">My Cards</a>
		<a href="/pokemon-card-tracker/sets" data-link="sets" data-tab="sets">Sets</a>
		<a href="/pokemon-card-tracker/check" data-link="check" data-tab="check">Phone check</a>
	</nav>
</body>
</html>
